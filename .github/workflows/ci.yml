name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy values: the build and smoke tests never reach a real backend.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9999
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key

jobs:
  verify:
    name: Types, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint src test e2e --max-warnings 0
      - run: npm run knip
      - run: npm run test:unit:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
      - run: npm run build

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts builds and starts the app itself.
      - run: npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore

  migrations:
    name: Migrations replay (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@d239d1052f6f024a8d746d7e5aeddead63b9cb53 # v3.1.0
        with:
          version: 2.121.0
      # Empty Postgres, then every file in supabase/migrations in order, then seed.sql.
      - run: supabase db start
      # And again through the path developers use, to prove the replay is repeatable.
      - run: supabase db reset --local
      - name: Every migration recorded and the seed loaded
        run: |
          set -eu
          q() { docker exec supabase_db_manthan-parent-portal psql -U postgres -tAc "$1"; }
          files=$(ls supabase/migrations/*.sql | wc -l)
          recorded=$(q "select count(*) from supabase_migrations.schema_migrations")
          echo "migration files: $files, recorded: $recorded"
          test "$files" = "$recorded"
          seed=$(q "select (select count(*) from students)||','||(select count(*) from ptm_slots)||','||(select count(*) from ptm_slots where booked_by_guardian_id is not null)||','||(select count(*) from custom_group_students)")
          echo "students,ptm_slots,booked,group_members: $seed"
          test "$seed" = "2,16,1,1"
      # RLS suite (pgTAP): supabase/tests, run in name order against the replayed database.
      - run: supabase test db

  audit:
    name: Dependency audit (production, high+)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
